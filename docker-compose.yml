name: pizza-analysis

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pizza}
      POSTGRES_USER: ${POSTGRES_USER:-pizza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: pizza-analysis-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pizza}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pizza}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      FIRST_ADMIN_USERNAME: ${FIRST_ADMIN_USERNAME:-}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOAD_GRAPH_ON_STARTUP: ${LOAD_GRAPH_ON_STARTUP:-false}
      GRAPH_DOWNLOAD_IF_MISSING: ${GRAPH_DOWNLOAD_IF_MISSING:-false}
      DATA_DIR: /app/data
      GRAPH_PATH: /app/data/nn_graph.pkl
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - graph_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: pizza-analysis-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  graph_data:

