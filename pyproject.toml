[project]
name = "pizza-analysis-system"
version = "0.1.0"
description = "NewFastPizza: система анализа заказов, KPI и рекомендаций"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
# ML-ядро (Ахметов) не форматируем и не линтуем в рамках бэкенд-задач
extend-exclude = ["backend/app/ml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"
