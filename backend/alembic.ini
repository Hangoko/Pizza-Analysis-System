# Конфигурация Alembic. Запуск из каталога backend/:
#   cd backend
#   alembic upgrade head
# или из корня репозитория:
#   alembic -c backend/alembic.ini upgrade head
# URL базы берётся из настроек приложения (DATABASE_URL), а не из этого файла.

[alembic]
script_location = %(here)s/alembic
# Корень репозитория в sys.path, чтобы работали импорты `backend.app...`
prepend_sys_path = %(here)s/..
file_template = %%(rev)s_%%(slug)s
path_separator = os
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
